server {
    # 监听端口和协议
    listen 80;
    
    # 服务器域名（多个用空格分隔）
    server_name token2048.odd.rs;

    
    # 默认索引文件
    index index.html index.htm index.php;
    
    # 字符集
    charset utf-8;
    
    # 访问日志配置
    access_log /var/log/nginx/token2048.access.log;
    error_log /var/log/nginx/token2048.error.log;
    
    # 基础安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
     # 统一 root
    root /www/token2048;
    location / {
        root /www/token2048/web;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /admin {
        root /www/token2048/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    # 静态资源缓存（admin）
    location ^~ /assets {
        root /www/token2048/admin;
    }

    location ~*/api/ {
        root /www/token2048/server;
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # 处理PHP文件（需要已安装PHP-FPM）
    location ~ \.php$ {
        # 配置PHP-FPM连接
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        
        # 安全设置（禁止访问不存在的PHP文件）
        try_files $uri =404;
    }
    
    # 静态资源缓存配置
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2)$ {

        # 可选：启用gzip压缩
        gzip_static on;
    }
    
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 禁止访问敏感文件
    location ~* (\.env|composer\.json|composer\.lock)$ {
        deny all;
    }
    
}